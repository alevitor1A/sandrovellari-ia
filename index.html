<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SandroVellari IA — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Source+Serif+4:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #ffffff;
    font-family: 'Source Serif 4', serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(ellipse at 30% 20%, #f5f5f5 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, #efefef 0%, transparent 50%);
    z-index: 0;
  }

  .login-wrapper {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
    padding: 20px;
  }

  .brand {
    text-align: center;
    margin-bottom: 48px;
  }

  .brand-name {
    font-family: 'Playfair Display', serif;
    font-size: 52px;
    font-weight: 900;
    color: #000000;
    letter-spacing: -2px;
    line-height: 1;
    display: block;
  }

  .brand-name span {
    font-size: 28px;
    font-weight: 400;
    letter-spacing: 0px;
  }

  .brand-sub {
    font-family: 'Source Serif 4', serif;
    font-size: 13px;
    color: #666;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 8px;
    font-weight: 300;
  }

  .login-card {
    background: #ffffff;
    border: 1.5px solid #000;
    padding: 48px 40px;
    position: relative;
  }

  .login-card::before {
    content: '';
    position: absolute;
    top: 5px;
    left: 5px;
    right: -5px;
    bottom: -5px;
    border: 1.5px solid #000;
    z-index: -1;
  }

  .login-title {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 700;
    color: #000;
    margin-bottom: 32px;
  }

  .form-group {
    margin-bottom: 20px;
  }

  label {
    display: block;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #333;
    margin-bottom: 8px;
    font-weight: 600;
  }

  input[type="email"],
  input[type="password"] {
    width: 100%;
    padding: 14px 16px;
    border: 1.5px solid #000;
    background: #fff;
    font-family: 'Source Serif 4', serif;
    font-size: 15px;
    color: #000;
    outline: none;
    transition: background 0.2s;
  }

  input:focus {
    background: #f9f9f9;
  }

  .btn-primary {
    width: 100%;
    padding: 16px;
    background: #000;
    color: #fff;
    border: none;
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 1px;
    transition: opacity 0.2s;
    margin-top: 8px;
  }

  .btn-primary:hover { opacity: 0.85; }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 0;
    color: #999;
    font-size: 12px;
    letter-spacing: 1px;
  }

  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #ddd;
  }

  .btn-google {
    width: 100%;
    padding: 14px;
    background: #fff;
    color: #000;
    border: 1.5px solid #000;
    font-family: 'Source Serif 4', serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: background 0.2s;
  }

  .btn-google:hover { background: #f5f5f5; }

  .btn-google svg { width: 18px; height: 18px; }

  .toggle-link {
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
    color: #666;
  }

  .toggle-link a {
    color: #000;
    font-weight: 600;
    cursor: pointer;
    text-decoration: underline;
  }

  .error-msg {
    background: #000;
    color: #fff;
    padding: 10px 14px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }
</style>
</head>
<body>

<div class="login-wrapper">
  <div class="brand">
    <span class="brand-name">Sandro<span>Vellari</span></span>
    <div class="brand-sub">Inteligência Artificial</div>
  </div>

  <div class="login-card">
    <div class="login-title" id="card-title">Entrar na sua conta</div>
    
    <div class="error-msg" id="error-msg"></div>

    <div class="form-group">
      <label>E-mail</label>
      <input type="email" id="email" placeholder="seu@gmail.com" />
    </div>

    <div class="form-group">
      <label>Senha</label>
      <input type="password" id="password" placeholder="••••••••" />
    </div>

    <button class="btn-primary" id="main-btn" onclick="handleEmailAuth()">Entrar</button>

    <div class="divider">ou</div>

    <button class="btn-google" onclick="handleGoogleLogin()">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continuar com Google
    </button>

    <div class="toggle-link">
      <span id="toggle-text">Não tem conta?</span>
      <a id="toggle-link" onclick="toggleMode()"> Criar conta</a>
    </div>
  </div>
</div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

  const firebaseConfig = {
    apiKey: "AIzaSyD4SyFFNHI1k2Nn0LWlGwXBpK5LG9q6rXg",
    authDomain: "vit4lynv-1fb7c.firebaseapp.com",
    databaseURL: "https://vit4lynv-1fb7c-default-rtdb.firebaseio.com",
    projectId: "vit4lynv-1fb7c",
    storageBucket: "vit4lynv-1fb7c.firebasestorage.app",
    messagingSenderId: "418954009350",
    appId: "1:418954009350:web:994b5251889e6df8815c87",
    measurementId: "G-4F6Z3T55C8"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  let isRegister = false;

  onAuthStateChanged(auth, (user) => {
    if (user) {
      sessionStorage.setItem('user', JSON.stringify({
        uid: user.uid,
        name: user.displayName || user.email.split('@')[0],
        email: user.email,
        photo: user.photoURL
      }));
      window.location.href = '/app.html';
    }
  });

  window.toggleMode = () => {
    isRegister = !isRegister;
    document.getElementById('card-title').textContent = isRegister ? 'Criar sua conta' : 'Entrar na sua conta';
    document.getElementById('main-btn').textContent = isRegister ? 'Criar conta' : 'Entrar';
    document.getElementById('toggle-text').textContent = isRegister ? 'Já tem conta?' : 'Não tem conta?';
    document.getElementById('toggle-link').textContent = isRegister ? ' Entrar' : ' Criar conta';
  };

  window.handleEmailAuth = async () => {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errEl = document.getElementById('error-msg');
    errEl.style.display = 'none';

    if (!email || !password) {
      errEl.textContent = 'Preencha e-mail e senha.';
      errEl.style.display = 'block';
      return;
    }

    try {
      if (isRegister) {
        await createUserWithEmailAndPassword(auth, email, password);
      } else {
        await signInWithEmailAndPassword(auth, email, password);
      }
    } catch (err) {
      const msgs = {
        'auth/wrong-password': 'Senha incorreta.',
        'auth/user-not-found': 'Usuário não encontrado.',
        'auth/email-already-in-use': 'E-mail já cadastrado.',
        'auth/weak-password': 'Senha muito fraca (mín. 6 caracteres).',
        'auth/invalid-email': 'E-mail inválido.'
      };
      errEl.textContent = msgs[err.code] || 'Erro ao entrar. Tente novamente.';
      errEl.style.display = 'block';
    }
  };

  window.handleGoogleLogin = async () => {
    try {
      await signInWithPopup(auth, provider);
    } catch (err) {
      const errEl = document.getElementById('error-msg');
      errEl.textContent = 'Erro ao entrar com Google.';
      errEl.style.display = 'block';
    }
  };
</script>
</body>
</html>
