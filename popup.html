<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sandro IA</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:340px; min-height:440px; background:#fff; font-family:'Source Serif 4',serif; display:flex; flex-direction:column; }
.header { background:#000; color:#fff; padding:14px 18px; }
.header h1 { font-family:'Playfair Display',serif; font-size:18px; font-weight:900; letter-spacing:-0.5px; }
.header p { font-size:9px; opacity:.45; letter-spacing:2.5px; text-transform:uppercase; margin-top:2px; }
.site-bar { padding:8px 14px; background:#f5f5f5; border-bottom:1px solid #e0e0e0; font-size:10px; color:#666; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.msgs { flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:7px; min-height:260px; max-height:300px; }
.msg { padding:9px 11px; font-size:12px; line-height:1.5; border:1.5px solid #000; animation:in .2s ease; }
@keyframes in { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
.msg.user { background:#000; color:#fff; align-self:flex-end; max-width:84%; }
.msg.ai { background:#fff; align-self:flex-start; max-width:92%; }
.msg.ai b { display:block; font-size:8px; letter-spacing:2px; opacity:.4; margin-bottom:3px; text-transform:uppercase; }
.typing { display:flex; gap:3px; padding:9px 11px; border:1.5px solid #000; align-self:flex-start; }
.typing span { width:5px; height:5px; background:#000; border-radius:50%; animation:t 1.2s infinite; }
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes t { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-5px)} }
.row { display:flex; border-top:1.5px solid #000; }
input { flex:1; border:none; padding:11px 13px; font-family:'Source Serif 4',serif; font-size:12px; outline:none; color:#000; }
button { background:#000; color:#fff; border:none; padding:0 14px; cursor:pointer; font-size:14px; transition:opacity .15s; }
button:hover { opacity:.8; }
</style>
</head>
<body>
<div class="header">
  <h1>Sandro IA</h1>
  <p>Assistente Web</p>
</div>
<div class="site-bar" id="site-bar">Carregando...</div>
<div class="msgs" id="msgs">
  <div class="msg ai"><b>Sandro IA</b>Olá! Posso ajudar a realizar tarefas neste site. Diga o que deseja.</div>
</div>
<div class="row">
  <input type="text" id="inp" placeholder="O que quer que eu faça aqui?" />
  <button onclick="send()">➤</button>
</div>
<script src="popup.js"></script>
</body>
</html>
