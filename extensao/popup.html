<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sandro IA</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 340px;
    min-height: 420px;
    background: #fff;
    font-family: 'Source Serif 4', serif;
    display: flex;
    flex-direction: column;
  }
  .header {
    background: #000;
    color: #fff;
    padding: 16px 20px;
  }
  .header-title {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 900;
    letter-spacing: -0.5px;
  }
  .header-sub {
    font-size: 10px;
    opacity: 0.5;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 2px;
  }
  .site-info {
    padding: 10px 16px;
    background: #f5f5f5;
    border-bottom: 1px solid #e0e0e0;
    font-size: 11px;
    color: #666;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 240px;
    max-height: 280px;
  }
  .msg {
    padding: 10px 12px;
    font-size: 13px;
    line-height: 1.5;
    border: 1.5px solid #000;
    animation: msgIn 0.2s ease;
  }
  @keyframes msgIn { from { opacity:0; transform: translateY(4px); } to { opacity:1; transform:translateY(0); } }
  .msg.user { background: #000; color: #fff; align-self: flex-end; max-width: 85%; }
  .msg.ai { background: #fff; align-self: flex-start; max-width: 90%; }
  .msg.ai strong { display: block; font-size: 9px; letter-spacing: 2px; opacity: 0.5; margin-bottom: 4px; }
  .input-row {
    display: flex;
    border-top: 1.5px solid #000;
  }
  input {
    flex: 1;
    border: none;
    padding: 12px 14px;
    font-family: 'Source Serif 4', serif;
    font-size: 13px;
    outline: none;
    color: #000;
  }
  button {
    background: #000;
    color: #fff;
    border: none;
    padding: 0 16px;
    cursor: pointer;
    font-size: 16px;
    transition: opacity 0.15s;
  }
  button:hover { opacity: 0.8; }
  .typing { display: flex; gap: 3px; padding: 10px 12px; border: 1.5px solid #000; }
  .typing span { width: 5px; height: 5px; background: #000; border-radius: 50%; animation: t 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes t { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-5px)} }
</style>
</head>
<body>
<div class="header">
  <div class="header-title">Sandro IA</div>
  <div class="header-sub">Assistente Web</div>
  <div style="margin-top:8px; font-size:12px; opacity:0.8; display:flex; align-items:center; gap:8px;">
    <input type="checkbox" id="allow-actions" /> <label for="allow-actions">Permitir executar ações</label>
  </div>
</div>
<div class="site-info" id="site-info">Carregando...</div>
  <div class="messages" id="messages">
  <div class="msg ai"><strong>Sandro</strong> Olá, posso ajudar você a realizar tarefas neste site. Diga o que deseja.</div>
</div>
<div class="input-row">
  <input type="text" id="user-input" placeholder="O que quer que eu faça aqui?" />
  <button onclick="sendMessage()">Enviar</button>
</div>

<script src="popup.js"></script>
</body>
</html>
